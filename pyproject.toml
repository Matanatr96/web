[project]
name = "dsa"
version = "0.1.0"
description = "Tennis video to rallies, shot speeds, line calls and stroke technique: WASB, TennisCourtDetector, RF-DETR and RTMW on Modal."
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch==2.14.0",
    "rfdetr==1.10.1",
    "rtmlib==0.0.16",
    "opencv-python==5.0.0.93",
    "scipy==1.17.1",
    "pyyaml==6.0.3",
    "numpy==2.4.6",
]

[project.optional-dependencies]
cloud = ["modal==1.5.5"]
dev = ["pytest>=8"]
# Line calls, shot speed, rally/match scoring and the per-rally Modal API (dsa.physics, dsa.gpu.rally_api).
# opencv/scipy are already core deps (opencv-python, scipy above); opencv-python-headless is used only
# inside the Modal image (volume.py) so the two cv2 wheels never clobber each other in one venv.
tennis = [
    "catboost==1.2.*",
    "fastapi>=0.115",
    "httpx>=0.27",
    "av>=12",
    "scipy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
