[project]
name = "dsa"
version = "0.1.0"
description = "Deep sports analysis: players, skeletons, ball and hits from tennis video (phone or TV), with off-the-shelf models."
requires-python = ">=3.11"
dependencies = [
    "torch==2.14.0",
    "torchvision==0.29.0",
    "rfdetr==1.10.1",
    "transformers==5.17.0",
    "supervision==0.30.3",
    "rtmlib==0.0.16",
    "opencv-python==5.0.0.93",
    "scipy==1.17.1",
    "pyyaml==6.0.3",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "numpy==2.4.6",
    "pillow==12.3.0",
    "anthropic==1.8.0",
    "scenedetect==0.7.1",
    "yt-dlp==2026.8.19",
    "umap-learn>=0.5.12",
]

[project.optional-dependencies]
cloud = ["modal==1.5.5"]
dev = ["pytest>=8"]
# Line calls, shot speed, rally/match scoring and the per-rally Modal API (dsa.physics, dsa.gpu.rally_api).
# opencv/scipy are already core deps (opencv-python, scipy above); opencv-python-headless is used only
# inside the Modal image (volume.py) so the two cv2 wheels never clobber each other in one venv.
tennis = [
    "catboost==1.2.*",
    "fastapi>=0.115",
    "httpx>=0.27",
    "av>=12",
    "scipy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dsa = ["*.html", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
