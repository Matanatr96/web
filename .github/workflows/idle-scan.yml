name: Idle Scan

# Hits /api/cron/idle-scan every 15 min during US market hours — the endpoint
# acts as a heartbeat. The actual scan cadence + caps are read from the
# `scanner_config` Supabase row (editable at /admin/scanner). The handler's
# isMarketHoursET() trims the exact edges of 9:30–16:00 ET.
# Cron is in UTC; 13–20 UTC covers 9:30am–4:00pm ET across DST transitions.

on:
  schedule:
    - cron: "*/15 13-20 * * 1-5"
  workflow_dispatch: # manual trigger from the Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Hit scanner endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: ${{ secrets.PROD_BASE_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$BASE_URL" ]; then
            echo "Missing CRON_SECRET or PROD_BASE_URL repo secret"
            exit 1
          fi
          curl -fsS -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/cron/idle-scan"
