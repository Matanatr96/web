name: CC Scanner

# Hits /api/cron/cc-scanner every 30 min during US market hours.
# Same UTC window as the CSP scanner — handler bails out at the exact edges.

on:
  schedule:
    - cron: "*/30 13-20 * * 1-5"
  workflow_dispatch: # manual trigger from the Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Hit scanner endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: ${{ secrets.PROD_BASE_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$BASE_URL" ]; then
            echo "Missing CRON_SECRET or PROD_BASE_URL repo secret"
            exit 1
          fi
          curl -fsS -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/cron/cc-scanner"
