name: SF Events Sync

# Syncs upcoming San Francisco events (Funcheap SF, 19hz Bay Area, SF Station)
# into Supabase via /api/sf/sync every morning at 14:00 UTC (7:00 AM PT)
# and supports manual workflow_dispatch triggers.

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SF events sync endpoint
        env:
          BASE_URL: ${{ secrets.PROD_BASE_URL || 'https://www.thelastmattapalli.com' }}
        run: |
          curl -fsSL -X POST "$BASE_URL/api/sf/sync"
